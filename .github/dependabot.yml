# Dependabot keeps npm dependencies and GitHub Actions current via weekly,
# grouped PRs. These PRs are a human-reviewed stream OUTSIDE the agent label
# state machine (see agents/WORKFLOW.md) — they carry only `dependencies`,
# never `agent` / `status:*`, so the planner / worker / reviewer agents never
# pick them up as pipeline work. Routine minor+patch bumps are grouped to avoid
# PR spam; a breaking major still opens its own PR (Dependabot's default).
version: 2
updates:
  # Backend (root) — Express + ws + simple-git; built-in node:sqlite needs no dep.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"

  # Frontend (Vite + React 19).
  - package-ecosystem: "npm"
    directory: "/client"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      dev-dependencies:
        dependency-type: "development"
        patterns:
          - "*"
      production-dependencies:
        dependency-type: "production"
        patterns:
          - "*"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      github-actions:
        patterns:
          - "*"
